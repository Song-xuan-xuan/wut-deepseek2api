<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 486" width="1000" height="486" role="img"
     aria-labelledby="t1 t2">
  <title id="t1">whut-2api 工作原理</title>
  <desc id="t2">AI 客户端通过本机代理注入学校 token，转发到 OpenWebUI，再调用 DeepSeek；
        代理同时负责 token 自动续期、用量落库与多 key 分发。</desc>

  <style>
    .flow { stroke-dasharray: 10 6; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .panel-pulse { animation: panelpulse 3.4s ease-in-out infinite; }
    @keyframes panelpulse { 0%, 100% { stroke-opacity: .45; } 50% { stroke-opacity: .95; } }
    .breath { animation: breath 3.2s ease-in-out infinite; }
    @keyframes breath { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .blink { animation: blink 2.6s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8.2" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#3d4756"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8.2" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6f9bff"/>
    </marker>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1000" height="486" rx="14" fill="#11151b" stroke="#232a34" stroke-width="1.5"/>
  <text x="500.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#e8ebf1">whut-2api 工作原理</text>
  <text x="500.0" y="55" text-anchor="middle" font-size="11.5" fill="#9aa5b5">把学校 OpenWebUI 包装成标准协议接口（OpenAI / Anthropic / Responses）· 客户端只需一个本地假 key</text>
  <g>
    <rect x="40" y="86" width="176" height="152" rx="12" fill="#191f28" stroke="#2b333f" filter="url(#soft)"/>
    <text x="128" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#e8ebf1">AI 客户端</text>
    <rect x="58" y="120" width="140" height="24" rx="7" fill="#1a2438" stroke="#6f9bff" stroke-opacity=".35"/>
    <text x="128" y="136" text-anchor="middle" font-size="11" fill="#6f9bff">pi / Cline</text>
    <rect x="58" y="148" width="140" height="24" rx="7" fill="#1a2438" stroke="#6f9bff" stroke-opacity=".35"/>
    <text x="128" y="164" text-anchor="middle" font-size="11" fill="#6f9bff">Cherry / Chatbox</text>
    <rect x="58" y="176" width="140" height="24" rx="7" fill="#1a2438" stroke="#6f9bff" stroke-opacity=".35"/>
    <text x="128" y="192" text-anchor="middle" font-size="11" fill="#6f9bff">Claude Code / Codex</text>
    <text x="128" y="212" text-anchor="middle" font-size="10.5" fill="#6d7887">本地假 key：sk-whut-local</text>
  </g>
  <!-- 脉冲环 -->
  <g>
    <ellipse cx="478" cy="166" rx="196" ry="94" fill="none" stroke="#6f9bff" stroke-width="1.4" opacity="0">
      <animate attributeName="rx" values="196;222" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="94;112" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".30;0" dur="3.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="478" cy="166" rx="196" ry="94" fill="none" stroke="#6f9bff" stroke-width="1.4" opacity="0">
      <animate attributeName="rx" values="196;222" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="94;112" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".30;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g>
    <rect x="286" y="78" width="384" height="176" rx="14" fill="#191f28" stroke="#6f9bff" stroke-opacity=".55" stroke-width="1.6" filter="url(#soft)" class="panel-pulse"/>
    <text x="302" y="103" font-size="13.5" font-weight="700" fill="#e8ebf1">whut-2api</text>
    <text x="382" y="103" class="mono" font-size="11" fill="#9aa5b5">127.0.0.1:8787</text>
    <text x="654" y="103" text-anchor="end" font-size="10.5" fill="#6d7887">本地常驻</text>
    <g class="">
    <rect x="304" y="116" width="172" height="42" rx="9" fill="#1a2438" stroke="#6f9bff" stroke-opacity=".38"/>
    <text x="316" y="133" font-size="11.5" font-weight="600" fill="#6f9bff">① 转发 proxy</text>
    <text x="316" y="148" font-size="9.5" fill="#9aa5b5">参数修正 · SSE 透传</text>
    </g>
    <g class="blink">
    <rect x="492" y="116" width="172" height="42" rx="9" fill="#14291f" stroke="#34d399" stroke-opacity=".38"/>
    <text x="504" y="133" font-size="11.5" font-weight="600" fill="#34d399">② 续期 auth</text>
    <text x="504" y="148" font-size="9.5" fill="#9aa5b5">学号登录 · 临期自动换</text>
    </g>
    <g class="">
    <rect x="304" y="166" width="172" height="42" rx="9" fill="#211c33" stroke="#a78bfa" stroke-opacity=".38"/>
    <text x="316" y="183" font-size="11.5" font-weight="600" fill="#a78bfa">③ 统计 usage</text>
    <text x="316" y="198" font-size="9.5" fill="#9aa5b5">token · 耗时 · 落库</text>
    </g>
    <g class="">
    <rect x="492" y="166" width="172" height="42" rx="9" fill="#2c2318" stroke="#f0b95c" stroke-opacity=".38"/>
    <text x="504" y="183" font-size="11.5" font-weight="600" fill="#f0b95c">④ 分发 access</text>
    <text x="504" y="198" font-size="9.5" fill="#9aa5b5">多 key · 配额 · 限速</text>
    </g>
    <text x="478" y="228" text-anchor="middle" font-size="10" fill="#9aa5b5">三种协议入口，同一份上游</text>
    <text x="478" y="243" text-anchor="middle" class="mono" font-size="9.5" fill="#6d7887">/v1/chat/completions · /v1/messages · /v1/responses</text>
  </g>
  <g>
    <rect x="740" y="86" width="224" height="152" rx="12" fill="#191f28" stroke="#2b333f" filter="url(#soft)"/>
    <text x="852" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#e8ebf1">学校 OpenWebUI</text>
    <text x="852" y="130" text-anchor="middle" class="mono" font-size="10" fill="#6f9bff">chatcloud.whut.edu.cn</text>
    <rect x="758" y="142" width="188" height="26" rx="7" fill="#122a2e" stroke="#4fd1e6" stroke-opacity=".35"/>
    <text x="852" y="159" text-anchor="middle" font-size="10.5" fill="#4fd1e6">POST /api/chat/completions</text>
    <text x="852" y="190" text-anchor="middle" font-size="10.5" fill="#9aa5b5">0.5.14 · 个人 API Key 已关闭</text>
    <text x="852" y="208" text-anchor="middle" font-size="10.5" fill="#9aa5b5">只能复用浏览器登录的 JWT</text>
    <text x="852" y="226" text-anchor="middle" font-size="10.5" fill="#6d7887">CAS 统一身份认证 + 使用申请</text>
  </g>
  <g>
    <rect x="778" y="306" width="186" height="70" rx="12" fill="#191f28" stroke="#2b333f" filter="url(#soft)"/>
    <text x="871" y="331" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e8ebf1">DeepSeek 云服务版</text>
    <text x="871" y="349" text-anchor="middle" font-size="10" fill="#9aa5b5">deepseek-v4-flash · deepseek-v3</text>
    <text x="871" y="365" text-anchor="middle" font-size="10" fill="#6d7887">工具调用原生支持</text>
  </g>
  <g>
    <rect x="40" y="306" width="176" height="70" rx="12" fill="#191f28" stroke="#34d399" stroke-opacity=".45" filter="url(#soft)"/>
    <text x="128" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#34d399">~/.whut-jwt</text>
    <text x="128" y="348" text-anchor="middle" font-size="10" fill="#9aa5b5">你的会话 token（600 权限）</text>
    <text x="128" y="364" text-anchor="middle" font-size="10" fill="#9aa5b5">按 mtime 热加载，改完即生效</text>

    <rect x="286" y="306" width="192" height="70" rx="12" fill="#191f28" stroke="#a78bfa" stroke-opacity=".45" filter="url(#soft)"/>
    <text x="382" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#a78bfa">usage.db · SQLite</text>
    <text x="382" y="348" text-anchor="middle" font-size="10" fill="#9aa5b5">用量 · 耗时 · 按 key 统计</text>
    <text x="382" y="364" text-anchor="middle" font-size="10" fill="#9aa5b5">重启不清零 · CSV 导出</text>
  </g>
  <text x="248" y="146" text-anchor="middle" font-size="9" fill="#6d7887">HTTP</text>
  <!-- 客户端 → 代理 -->
  <path d="M216 162 H280" stroke="#3d4756" stroke-width="1.8" fill="none" marker-end="url(#arrow)" class="flow"/>
  <!-- 代理 → 学校 -->
  <path d="M670 162 H734" stroke="#3d4756" stroke-width="1.8" fill="none" marker-end="url(#arrow)" class="flow"/>
  <!-- 学校 → DeepSeek -->
  <path d="M871 238 V300" stroke="#3d4756" stroke-width="1.8" fill="none" marker-end="url(#arrow)" class="flow"/>
  <!-- token ↔ 代理 -->
  <path d="M128 306 V258" stroke="#34d399" stroke-width="1.6" stroke-dasharray="4 5" fill="none" opacity=".75"/>
  <!-- usage ↔ 代理 -->
  <path d="M382 306 V258" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="4 5" fill="none" opacity=".75"/>
  <path d="M478 258 V300" stroke="none"/>
  <!-- 请求光点：客户端 → 代理 → 学校 -->
  <circle r="3.6" fill="#6f9bff">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M216 162 H734"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.88;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 响应光点：学校 → 代理 → 客户端 -->
  <circle r="3" fill="#34d399">
    <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M734 174 H216"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.88;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>
  <!-- 学校 → DeepSeek -->
  <circle r="3" fill="#4fd1e6">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M871 240 V298"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- token 注入 -->
  <circle r="2.6" fill="#34d399">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M128 302 V260"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 用量落库 -->
  <circle r="2.6" fill="#a78bfa">
    <animateMotion dur="2.2s" begin=".7s" repeatCount="indefinite" path="M382 260 V302"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="2.2s" begin=".7s" repeatCount="indefinite"/>
  </circle>
  <line x1="40" y1="402" x2="960" y2="402" stroke="#2b333f" stroke-width="1"/>
  <g>
    <text x="40" y="426" font-size="10.5" fill="#9aa5b5">
      <tspan font-weight="600" fill="#e8ebf1">为什么需要它：</tspan>
      <tspan>学校关掉了个人 API Key，只能用浏览器 JWT（7 天过期），且各工具配置分散</tspan>
    </text>
    <text x="40" y="446" font-size="10.5" fill="#9aa5b5">
      <tspan font-weight="600" fill="#e8ebf1">代理做了四件事：</tspan>
      <tspan>① 注入 token 并修正参数</tspan>
      <tspan dx="8">② 临期自动续期</tspan>
      <tspan dx="8">③ 用量落库</tspan>
      <tspan dx="8">④ 多设备分发 key</tspan>
    </text>
    <text x="40" y="466" font-size="10.5" fill="#6d7887">
      <tspan>流式透传 · 缺 [DONE] 补齐 · 静默心跳 · 熔断冷却 · 上游 401/403 当场续期重试</tspan>
    </text>
  </g>
</svg>
