services:
  whut-2api:
    build: .
    image: ghcr.io/song-xuan-xuan/wut-deepseek2api:latest
    container_name: whut-2api
    env_file:
      - .env
    environment:
      WHUT_HOST: 0.0.0.0
      WHUT_PORT: "8787"
    volumes:
      # token 与用量库都在这里，重建容器不丢
      - ./data:/app/data
    ports:
      # 默认只绑本机；要给手机/平板用，改成 "8787:8787" 并自己加鉴权
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
